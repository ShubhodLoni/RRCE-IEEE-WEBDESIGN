<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Member Resources & Toolkits | IEEE RRCE Member Portal</title>
    <meta
      name="description"
      content="Curated IEEE learning resources, research paper LaTeX templates, competitive algorithms handbooks, and slide decks."
    />
    <meta name="theme-color" content="#0A2A5E" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/portal.css" />
    <link rel="stylesheet" href="../css/chatbot.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("rrce-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-root="../" data-page="resources">
    <a class="skip-link" href="#main">Skip to resources list</a>

    <div class="portal-layout">
      <aside class="portal-sidebar" id="portal-sidebar"></aside>

      <div class="portal-main">
        <header class="portal-topbar" id="portal-topbar"></header>

        <main class="portal-content" id="main">
          <div class="portal-page-head">
            <div>
              <p class="section-kicker" style="margin:0 0 0.25rem;">Knowledge Base</p>
              <h1>Learning Resources & Toolkits</h1>
              <p style="margin:0; color:var(--muted); font-size:0.92rem;">
                Official templates, firmware testing suites, slide decks, and competitive programming guides.
              </p>
            </div>
            <div>
              <a class="btn btn--outline" href="https://ieeexplore.ieee.org" target="_blank" rel="noopener">
                Open IEEE Xplore &rarr;
              </a>
            </div>
          </div>

          <!-- Type Filter Chips -->
          <div class="chips" id="portal-resources-chips" role="group" aria-label="Resource Type Filters">
            <button class="chip is-active" type="button" data-chip="All">All Resources</button>
            <button class="chip" type="button" data-chip="Bookmarks">★ Bookmarked</button>
            <button class="chip" type="button" data-chip="Guide">Guides</button>
            <button class="chip" type="button" data-chip="Cheatsheet">Cheatsheets</button>
            <button class="chip" type="button" data-chip="Slide Deck">Slide Decks</button>
            <button class="chip" type="button" data-chip="Tool">Tools & Templates</button>
            <button class="chip" type="button" data-chip="Paper">Papers</button>
          </div>

          <!-- Resources List Container -->
          <div style="display:flex; flex-direction:column; gap:0.75rem;" id="portal-resources-list"></div>
        </main>
      </div>
    </div>

    <div id="site-overlays"></div>

    <script src="../js/data.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/portal-data.js"></script>
    <script src="../js/portal.js"></script>
    <script src="../js/chatbot.js"></script>
  </body>
</html>
