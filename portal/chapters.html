<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Society Chapters | IEEE RRCE Member Portal</title>
    <meta
      name="description"
      content="Join and manage technical society chapters at RajaRajeswari College of Engineering (RRCE) IEEE Student Branch."
    />
    <meta name="theme-color" content="#0A2A5E" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/portal.css" />
    <link rel="stylesheet" href="../css/chatbot.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("rrce-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-root="../" data-page="chapters">
    <a class="skip-link" href="#main">Skip to chapters</a>

    <div class="portal-layout">
      <aside class="portal-sidebar" id="portal-sidebar"></aside>

      <div class="portal-main">
        <header class="portal-topbar" id="portal-topbar"></header>

        <main class="portal-content" id="main">
          <div class="portal-page-head">
            <div>
              <p class="section-kicker" style="margin:0 0 0.25rem;">Affinity Units</p>
              <h1>Technical Society Chapters</h1>
              <p style="margin:0; color:var(--muted); font-size:0.92rem;">
                Explore department-mapped technical societies. Join affinity groups to participate in specialized workshops and research projects.
              </p>
            </div>
            <div>
              <a class="btn btn--outline" href="../chapters.html">Public Chapters Guide &rarr;</a>
            </div>
          </div>

          <!-- Chapters Grid Container -->
          <div class="grid grid-3" id="portal-chapters-list"></div>
        </main>
      </div>
    </div>

    <div id="site-overlays"></div>

    <script src="../js/data.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/portal-data.js"></script>
    <script src="../js/portal.js"></script>
    <script src="../js/chatbot.js"></script>
  </body>
</html>
