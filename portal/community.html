<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Member Community & Discussions | IEEE RRCE Member Portal</title>
    <meta
      name="description"
      content="Engage with fellow engineering peers, ask technical questions, and connect with mentors at IEEE RRCE Student Branch."
    />
    <meta name="theme-color" content="#0A2A5E" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/portal.css" />
    <link rel="stylesheet" href="../css/chatbot.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("rrce-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body data-root="../" data-page="community">
    <a class="skip-link" href="#main">Skip to community</a>

    <div class="portal-layout">
      <aside class="portal-sidebar" id="portal-sidebar"></aside>

      <div class="portal-main">
        <header class="portal-topbar" id="portal-topbar"></header>

        <main class="portal-content" id="main">
          <div class="portal-page-head">
            <div>
              <p class="section-kicker" style="margin:0 0 0.25rem;">Peer Exchange</p>
              <h1>Community Discussion Board</h1>
              <p style="margin:0; color:var(--muted); font-size:0.92rem;">
                Ask technical questions, share lab discoveries, and find project collaborators across RRCE departments.
              </p>
            </div>
            <div>
              <button class="btn btn--yellow" type="button" id="request-mentor-btn">
                🤝 Request a Mentor
              </button>
            </div>
          </div>

          <div style="display:grid; grid-template-columns:1.8fr 1fr; gap:1.5rem; align-items:flex-start;">
            <!-- Left: Discussion Feed -->
            <div style="display:flex; flex-direction:column; gap:1rem;" id="community-posts-list"></div>

            <!-- Right: Post New Thread Form -->
            <div class="card card__body" style="position:sticky; top:85px;">
              <h3 style="margin-top:0;">Start a Discussion</h3>
              <form id="community-new-post-form" style="display:grid; gap:0.75rem;">
                <label>
                  Topic Title
                  <input type="text" name="title" required placeholder="e.g. Tips on KiCAD ground plane routing" />
                </label>
                <label>
                  Question or Idea Details
                  <textarea name="body" rows="4" required placeholder="Describe your question or observation in detail..."></textarea>
                </label>
                <button class="btn btn--blue" type="submit">Post to Community</button>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="site-overlays"></div>

    <script src="../js/data.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/portal-data.js"></script>
    <script src="../js/portal.js"></script>
    <script src="../js/chatbot.js"></script>
  </body>
</html>
